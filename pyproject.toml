requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "duckdb>=1.5.5",
    "peft>=0.20.0",
    "requests>=2.34.2",
    "sqlfluff>=4.3.0",
    "sqlglot>=30.18.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]
